name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: pyne-runtime-dist
          path: dist/
          if-no-files-found: error

  package-smoke:
    name: Installed wheel Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pyne-runtime-dist
          path: dist

      - name: Smoke installed wheel
        run: python scripts/package_smoke.py --dist-dir dist

  release:
    name: Publish verified ${{ github.ref_name }}
    needs: [build, package-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pyne-runtime-dist
          path: dist

      - name: Validate and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/release_assets.py
          --tag "$RELEASE_TAG"
          --dist-dir dist
          --notes-file release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc|dev)[0-9]+ ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
