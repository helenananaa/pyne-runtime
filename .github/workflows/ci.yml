name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .[dev,pandas]

      - name: Static and project status gates
        run: |
          python -m compileall src tests -q
          python -m ruff check .
          python scripts/project_status.py --check
          git diff --check

      - name: Test
        run: python -m pytest

      - name: Strategy capture gates
        run: |
          python scripts/strategy_capture_scaffold.py --check
          python scripts/strategy_capture_diff.py --assertion parity

      - name: TA and request capture gates
        run: |
          python scripts/ta_capture_diff.py --assertion parity
          python scripts/request_capture_diff.py --assertion parity

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: pyne-runtime-dist
          path: dist/
          if-no-files-found: error

  package-smoke:
    name: Installed wheel Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pyne-runtime-dist
          path: dist

      - name: Smoke installed wheel
        run: python scripts/package_smoke.py --dist-dir dist
